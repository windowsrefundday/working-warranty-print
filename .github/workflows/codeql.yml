name: CodeQL

on:
  push:
  pull_request:
  schedule:
    - cron: "31 3 * * 1"

permissions:
  actions: read
  contents: read

jobs:
  detect_javascript:
    name: Detect JavaScript and TypeScript sources
    runs-on: ubuntu-latest
    outputs:
      has_javascript: ${{ steps.detect.outputs.has_javascript }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Detect tracked JavaScript and TypeScript files
        id: detect
        shell: bash
        run: |
          if git ls-files -- \
            '*.js' '*.jsx' '*.ts' '*.tsx' '*.mjs' '*.cjs' \
            '*.mts' '*.cts' '*.es' '*.es6' | grep -q .; then
            echo "has_javascript=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_javascript=false" >> "$GITHUB_OUTPUT"
          fi

  analyze_python:
    name: Analyze Python
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        with:
          languages: python
          build-mode: none
      - name: Analyze
        uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4

  analyze_javascript:
    name: Analyze JavaScript and TypeScript
    needs: detect_javascript
    if: needs.detect_javascript.outputs.has_javascript == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        with:
          languages: javascript-typescript
          build-mode: none
      - name: Analyze
        uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
